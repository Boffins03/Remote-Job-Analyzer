<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Job Analyzer" }}</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4361ee;
      --primary-dark: #3a56d4;
      --secondary: #6c757d;
      --success: #4cc9a7;
      --info: #4895ef;
      --warning: #f7b801;
      --danger: #f72585;
      --dark: #1e1e2f;
      --light: #f8f9fa;
      --sidebar-width: 260px;
      --header-height: 70px;
    }

    * {
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #333;
      overflow-x: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: linear-gradient(180deg, var(--dark) 0%, #2a2a40 100%);
      color: white;
      padding-top: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .sidebar-header {
      padding: 0 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .sidebar-header h4 {
      font-weight: 700;
      color: white;
      margin: 0;
    }

    .sidebar-header p {
      font-size: 0.8rem;
      opacity: 0.7;
      margin: 0;
    }

    .sidebar a {
      color: #b1b1b1;
      text-decoration: none;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      margin: 5px 10px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .sidebar a i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    .sidebar a:hover, .sidebar a.active {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transform: translateX(5px);
    }

    .sidebar a.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
    }

    .content {
      margin-left: var(--sidebar-width);
      padding: 30px;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    .page-header {
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .page-header h2 {
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 5px;
    }

    .page-header p {
      color: var(--secondary);
      margin: 0;
    }

    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      background: white;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding: 15px 20px;
      font-weight: 600;
    }

    .stat-card {
      padding: 25px;
      text-align: center;
    }

    .stat-card h6 {
      color: var(--secondary);
      font-size: 0.9rem;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .stat-card h2 {
      color: var(--dark);
      font-weight: 700;
      margin-bottom: 0;
    }

    .stat-card i {
      font-size: 2rem;
      margin-bottom: 15px;
      opacity: 0.8;
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .table thead th {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      font-weight: 600;
    }

    .table tbody td {
      padding: 15px;
      vertical-align: middle;
      border-color: rgba(0, 0, 0, 0.05);
    }

    .btn {
      border-radius: 8px;
      font-weight: 500;
      padding: 8px 16px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      border: none;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(-100%);
      }
      
      .sidebar.active {
        transform: translateX(0);
      }
      
      .content {
        margin-left: 0;
      }
      
      .mobile-toggle {
        display: block;
      }
    }

    /* Loading animation */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Enhanced filter styles */
    .filter-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      padding: 20px;
      color: white;
      margin-bottom: 2rem;
    }

    .filter-section .form-label {
      color: white;
      font-weight: 600;
    }

    .sort-header {
      color: var(--dark) !important;
      transition: color 0.2s ease;
    }

    .sort-header:hover {
      color: var(--primary) !important;
    }

    /* Loading states */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 12px;
    }

    /* Filter badges */
    .filter-badge {
      background: var(--primary);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-left: 8px;
    }

  </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <h4>Job Analyzer</h4>
    <p>Professional Job Market Insights</p>
  </div>

  <a href="/" class="{% if request.path == '/' %}active{% endif %}">
    <i class="fas fa-tachometer-alt"></i> Dashboard
  </a>
  <a href="/charts" class="{% if '/charts' in request.path %}active{% endif %}">
    <i class="fas fa-chart-bar"></i> Analytics
  </a>
  <a href="/jobs" class="{% if '/jobs' in request.path %}active{% endif %}">
    <i class="fas fa-briefcase"></i> Job Listings
  </a>
</div>

<!-- Content -->
<div class="content">
  {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Mobile sidebar toggle
  document.addEventListener('DOMContentLoaded', function() {
    // Add mobile toggle button if needed
    if (window.innerWidth < 992) {
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn btn-primary mobile-toggle position-fixed';
      toggleBtn.style.cssText = 'top: 20px; left: 20px; z-index: 999;';
      toggleBtn.innerHTML = '<i class="fas fa-bars"></i>';
      document.body.appendChild(toggleBtn);
      
      toggleBtn.addEventListener('click', function() {
        document.querySelector('.sidebar').classList.toggle('active');
      });
    }
  });
</script>

</body>
</html>
